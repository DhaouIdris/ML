[project]
name = "le-bon-radar"
version = "0.1.0"
description = "Détection automatisée de bonnes affaires automobiles à partir d'annonces Leboncoin."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Dhaou Idris", email = "idris.dhaou@gmail.com" }]
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.5,<5.0",
    "xgboost>=2.1,<3.0",
    "pyarrow>=16.0,<18.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.4,<10.0",
    "beautifulsoup4>=4.12,<5.0",
    "streamlit>=1.37,<2.0",
    "plotly>=5.23,<6.0",
    "joblib>=1.4,<2.0",
    "loguru>=0.7,<1.0",
]

[tool.poetry]
packages = [{ include = "le_bon_radar", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-cov = ">=5.0,<7.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.11,<2.0"
pandas-stubs = ">=2.2,<3.0"
pre-commit = ">=3.8,<4.0"
ipykernel = ">=6.29,<7.0"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/le_bon_radar --cov-report=term-missing"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"